<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WebSocket 编程式升级</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', sans-serif;
        background: #e8e8e8;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    h2 { margin-bottom: 8px; color: #333; font-weight: 300; }
    .sub { color: #888; font-size: 12px; margin-bottom: 20px; }
    .container { display: flex; gap: 16px; width: 720px; max-width: 96%; height: 60vh; }
    .panel {
        flex: 1;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.12);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-height: 0;
    }
    .panel-header {
        padding: 12px 14px;
        background: #f5f5f5;
        border-bottom: 1px solid #e0e0e0;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
    }
    .panel-header .info { font-size: 12px; color: #888; }
    .avatar {
        width: 32px; height: 32px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        color: #fff; font-size: 13px; font-weight: 600;
        background: linear-gradient(135deg, #11998e, #38ef7d);
    }
    .chat {
        flex: 1; overflow-y: auto;
        padding: 10px 14px; background: #f7f7f7;
        min-height: 0;
    }
    .msg-wrapper { clear: both; margin: 3px 0; display: flex; align-items: flex-end; gap: 5px; }
    .self-wrapper { flex-direction: row-reverse; }
    .msg {
        max-width: 70%;
        padding: 7px 11px;
        border-radius: 12px;
        font-size: 13px; line-height: 1.4;
        word-break: break-all;
    }
    .self { background: #95ec69; color: #1a3d0a; border-bottom-right-radius: 3px; }
    .other { background: #fff; color: #333; border: 1px solid #ddd; border-bottom-left-radius: 3px; }
    .system { text-align: center; color: #999; font-size: 11px; clear: both; padding: 3px 0; }
    .footer { padding: 10px; border-top: 1px solid #e0e0e0; display: flex; gap: 6px; align-items: center; }
    .footer input {
        flex: 1; padding: 7px 10px;
        border: 1px solid #ddd; border-radius: 18px;
        outline: none; font-size: 12px;
    }
    .footer input:focus { border-color: #666; }
    .footer input:disabled { background: #f0f0f0; }
    .footer button {
        padding: 7px 14px; border: none; border-radius: 18px;
        cursor: pointer; font-size: 12px; color: #fff; font-weight: 500;
    }
    .connect-btn { background: #667eea; }
    .close-btn { background: #e53935; }
    .upgrade-hint {
        font-size: 11px; color: #999;
        padding: 8px 14px; background: #fafafa; border-top: 1px dashed #e0e0e0;
    }
    .upgrade-hint code { background: #eee; padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>

<h2>WebSocket 编程式升级</h2>
<div class="sub">通过 HttpRequest#upgrade(WebSocketResource) 端到端升级 · 回声模式</div>

<div class="container">
    <div class="panel">
        <div class="panel-header">
            <div class="avatar">W</div>
            <div><h3 id="connTitle">未连接</h3></div>
            <div class="info" id="connState">idle</div>
        </div>
        <div class="chat" id="chat"></div>
        <div class="footer">
            <input id="msg" placeholder="输入文本发送（服务端回声）..." disabled onkeydown="if(event.key==='Enter') sendText()"/>
            <button class="connect-btn" onclick="connect()">连接</button>
            <button class="close-btn" onclick="disconnect()">关闭</button>
        </div>
        <div class="upgrade-hint">
            升级端点：<code>/ws/upgrade?name=xxx</code> · 无 <code>name</code> 会被拒绝（HTTP 响应）<br/>
            二进制帧：连接后自动发送一次（服务端原样回声）
        </div>
    </div>
</div>

<script>
    var ws = null;
    var chat = document.getElementById('chat');
    var msgInput = document.getElementById('msg');
    var connTitle = document.getElementById('connTitle');
    var connState = document.getElementById('connState');

    function add(text, cls) {
        var w = document.createElement('div');
        w.className = 'msg-wrapper' + (cls === 'self' ? ' self-wrapper' : '');
        var m = document.createElement('div');
        m.className = 'msg ' + cls;
        m.textContent = text;
        w.appendChild(m);
        chat.appendChild(w);
        chat.scrollTop = chat.scrollHeight;
    }
    function sys(text) {
        var d = document.createElement('div');
        d.className = 'system';
        d.textContent = text;
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
    }

    function setState(text, connected) {
        connState.textContent = text;
        connTitle.textContent = connected ? '已连接 (programmatic)' : '未连接';
        msgInput.disabled = !connected;
    }

    function connect() {
        if (ws && ws.readyState === WebSocket.OPEN) { sys('已连接，无需重复连接'); return; }
        var name = (prompt('请输入 name 参数（升级校验用）') || '').trim();
        if (!name) { sys('未提供 name，升级会被拒绝'); }
        var uri = 'ws://' + location.host + '/ws/upgrade?name=' + encodeURIComponent(name);
        sys('正在发起 WebSocket 升级: ' + uri);
        ws = new WebSocket(uri);
        ws.onopen = function() {
            setState('OPEN', true);
            sys('升级成功，连接建立');
            // 自动发送一次二进制帧，验证 binary 回声
            ws.send(new Uint8Array([1, 2, 3, 4, 5]));
            sys('已发送二进制帧 [1,2,3,4,5]');
        };
        ws.onmessage = function(e) {
            if (e.data instanceof ArrayBuffer || e.data instanceof Blob) {
                var arr = new Uint8Array(e.data);
                add('binary echo [' + Array.prototype.join.call(arr, ',') + ']', 'other');
            } else {
                add(String(e.data), 'other');
            }
        };
        ws.onerror = function(e) {
            sys('连接错误（可能升级被拒绝，或未提供 name）');
            setState('ERROR', false);
        };
        ws.onclose = function(e) {
            sys('连接关闭: code=' + e.code + ' reason=' + e.reason);
            setState('CLOSED', false);
            ws = null;
        };
    }

    function disconnect() {
        if (ws && ws.readyState === WebSocket.OPEN) { ws.close(1000, 'client bye'); }
        else { sys('当前未连接'); }
    }

    function sendText() {
        var t = msgInput.value.trim();
        if (!t) return;
        if (!ws || ws.readyState !== WebSocket.OPEN) { sys('未连接'); return; }
        add(t, 'self');
        ws.send(t);
        msgInput.value = '';
    }
</script>

</body>
</html>
